app.environment=${RAILWAY_ENVIRONMENT_NAME:local.dev}

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

security.jwt.issuer=http://localhost:8081/userservice
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/userservice/.well-known/jwks.json

spring.datasource.url=jdbc:postgresql://localhost:5432/pedal_pal_service_dev

spring.docker.compose.enabled=true

spring.jpa.show-sql=true

# Maintenance suggestion job configuration
jobs.maintenance-suggestions.enabled=true

# Cron expression (daily at 02:00)
# Every 5 minutes for testing: 0 */5 * * * *
jobs.maintenance-suggestions.page-size=100
jobs.maintenance-suggestions.suggestion-type-code=SUGGESTION_TYPE_IA
jobs.maintenance-suggestions.priority-code=
jobs.maintenance-suggestions.urgency-code=
jobs.maintenance-suggestions.deduplication-window-days=7
jobs.maintenance-suggestions.system-username=system

#
logging.level.com.quetoquenana.pedalpal=DEBUG

security.jwt.aud=PEDPAL

strava.oauth-base-url=https://www.strava.com/oauth
strava.api-base-url=https://www.strava.com/api/v3
strava.scopes=${STRAVA_SCOPES:read,activity:read}

